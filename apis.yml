aid: panjiva
name: Panjiva
description: >-
  Panjiva is a supply chain intelligence platform owned by S&P Global Market
  Intelligence that delivers data-driven insights for the global trade
  community. It combines global import/export shipment records with machine
  learning analytics to profile companies, map supply chains, benchmark
  competitors, surface sales leads, and assess counterparty and supply-chain
  risk. Panjiva covers roughly 9 million companies and more than 2 billion
  shipment records spanning an estimated 35% of global trade flows. Trade data
  is also delivered programmatically to CRM systems, quantitative models, and
  research workflows through S&P Global's XpressFeed data-feed service and is
  surfaced inside S&P Capital IQ Pro. Access is enterprise and subscription
  based; Panjiva does not publish a public self-serve developer API portal.
